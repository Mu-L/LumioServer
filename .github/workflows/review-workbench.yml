name: PR38 Remediation Workbench
on:
  push:
    branches: [fix/server-review-correctness-20260906]
    paths:
      - '.github/workflows/review-workbench.yml'
      - 'eng/review-workbench/**'
permissions:
  contents: write
concurrency:
  group: pr38-remediation-workbench
  cancel-in-progress: false
jobs:
  remediate:
    if: github.repository == 'LumioGames/LumioServer' && github.ref == 'refs/heads/fix/server-review-correctness-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Materialize reviewed changes on the PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -f eng/review-workbench/merge.py; then python3 eng/review-workbench/merge.py; fi
          if test -f eng/review-workbench/apply.py; then python3 eng/review-workbench/apply.py; fi
          if test -f eng/review-workbench/after.py; then python3 eng/review-workbench/after.py; fi
          git restore -- .github/workflows
          cargo fmt --all
          git diff --check
          git diff --stat
          git add -A
          if ! git diff --cached --quiet || test -f .git/MERGE_HEAD; then
            git commit -m 'fix(server): reconcile upstream and materialize reviewed hardening'
            git push origin HEAD:refs/heads/fix/server-review-correctness-20260906
          fi
          echo "VERIFIED_SOURCE_SHA=$(git rev-parse HEAD)" | tee -a "$GITHUB_ENV"
      - name: Source structure and tests
        shell: bash
        run: |
          set -uo pipefail
          status=0
          python3 eng/verify.py --profile rust || status=1
          python3 eng/verify.py --profile managed || status=1
          echo "Source tested: $VERIFIED_SOURCE_SHA; status=$status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Package exact source and patch for review
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/verification
          git archive --format=zip -o artifacts/verification/LumioServer-source.zip HEAD
          git diff --binary ce34ac75303f4746c48ba74b706cff6189b038c5 HEAD > artifacts/verification/LumioServer-review.patch
          git rev-parse HEAD > artifacts/verification/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remediation-verification-${{ github.run_id }}
          path: artifacts/verification
          if-no-files-found: error
