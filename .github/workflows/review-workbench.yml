name: PR38 Remediation Workbench
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/review-workbench.yml'
      - 'eng/review-workbench/**'
permissions:
  contents: write
concurrency:
  group: pr38-remediation-workbench
  cancel-in-progress: false
jobs:
  remediate:
    if: github.event.pull_request.number == 38 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/server-review-correctness-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Materialize reviewed changes on the PR branch only
        shell: bash
        run: |
          set -euo pipefail
          if test -f eng/review-workbench/apply.py; then python3 eng/review-workbench/apply.py; fi
          if test -f eng/review-workbench/after.py; then python3 eng/review-workbench/after.py; fi
          git restore -- .github/workflows
          cargo fmt --all
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix(server): materialize reviewed hardening and canonical formatting'
            git push origin HEAD:refs/heads/fix/server-review-correctness-20260906
          fi
          echo "VERIFIED_SOURCE_SHA=$(git rev-parse HEAD)" | tee -a "$GITHUB_ENV"
      - name: Source structure and tests
        shell: bash
        run: |
          set -uo pipefail
          status=0
          python3 eng/verify.py --profile rust || status=1
          python3 eng/verify.py --profile managed || status=1
          echo "Source tested: $VERIFIED_SOURCE_SHA; status=$status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remediation-verification-${{ github.run_id }}
          path: artifacts/verification
          if-no-files-found: warn
