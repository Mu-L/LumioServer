name: Repository Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme:
    name: README policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate LumioAgent specification and repository boundary
        run: |
          node .spec/tools/spec-lint.mjs
          node --test .spec/tools/spec-lint.test.mjs
          test -s README.md
          test -s LICENSE
          test -s .gitattributes
          grep -q '^\*\.md text eol=lf$' .gitattributes
          grep -q '^## 职责$' README.md
          grep -q '^## 明确不负责什么$' README.md
          grep -q '^## Source / Compile-Time Dependencies$' README.md
          grep -q '^## Headless Test Surface$' README.md
          grep -q '^## 子模块' README.md
          grep -q '^## 当前阶段与开发节奏$' README.md

  rust:
    name: Rust unit and socket checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile production profile and test harness profile
        run: python eng/verify.py --profile rust
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-verification-${{ matrix.os }}
          path: artifacts/verification
          if-no-files-found: error

  managed:
    name: Managed build and account tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build actual managed bridge and run account tests
        run: python eng/verify.py --profile managed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-verification-${{ matrix.os }}
          path: artifacts/verification
          if-no-files-found: error

  required-gate:
    name: Required module gate (not release certification)
    runs-on: ubuntu-latest
    if: always()
    needs: [readme, rust, managed]
    env:
      README_RESULT: ${{ needs.readme.result }}
      RUST_RESULT: ${{ needs.rust.result }}
      MANAGED_RESULT: ${{ needs.managed.result }}
    steps:
      - name: No skipped, blocked, cancelled or failed required checks
        run: |
          test "$README_RESULT" = success
          test "$RUST_RESULT" = success
          test "$MANAGED_RESULT" = success
          echo 'Module checks passed. Native/CoreCLR/Game/Platform integration and release validation are separate and are NOT implied.' >> "$GITHUB_STEP_SUMMARY"
