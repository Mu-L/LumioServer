name: Pinned cross-repository integration (explicit environment)

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Absolute path to a reviewed exact-SHA/artifact manifest on the integration runner
        required: true
        type: string
      game_root:
        description: Absolute path to the manifest-pinned LumioGame checkout
        required: true
        type: string

permissions:
  contents: read

jobs:
  integration:
    runs-on: [self-hosted, lumio-integration]
    timeout-minutes: 30
    env:
      PINNED_INPUTS: ${{ inputs.manifest_path }}
      LUMIO_GAME_ROOT: ${{ inputs.game_root }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate exact inputs and run the unchanged eleven-scenario test
        shell: bash
        run: python3 eng/verify.py --profile integration --inputs "$PINNED_INPUTS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-integration-evidence
          path: artifacts/verification
          if-no-files-found: error
